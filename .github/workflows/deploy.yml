name: Build & Deploy to XSERVER

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: npm ci

      # 4. .env を GitHub Secrets から生成
      - name: Create .env file
        run: |
          cat <<EOF > .env
          MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}
          EOF

      # 5. Astro ビルド（静的HTMLを dist/ に生成）
      - name: Build Astro site
        run: npm run build

      # 6. エックスサーバー（メイン bizarch-design.com）へFTP転送
      - name: Deploy main site to XSERVER via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      # 7. エックスサーバー（サブドメイン aistartup.bizarch-design.com）へFTP転送
      - name: Deploy AI起業シミュレーター to XSERVER subdomain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./aistartup/
          server-dir: ${{ secrets.FTP_SERVER_DIR_AISTARTUP }}
          dangerous-clean-slate: false
          exclude: |
            **/test_node.js
            **/.git*

      # 8. エックスサーバー（サブドメイン aisolobiz.bizarch-design.com）へFTP転送
      - name: Deploy AI個人事業の教科書 to XSERVER subdomain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./aisolobiz/
          server-dir: ${{ secrets.FTP_SERVER_DIR_AISOLOBIZ }}
          dangerous-clean-slate: false
          exclude: |
            **/test_node.js
            **/build_textbook.py
            **/PROMPTS_FOR_USER.md
            **/image_prompts.md
            **/generate_images.mjs
            **/regenerate_v2.mjs
            **/_generation_log.json
            **/予備/**
            **/.git*

      # 9. cms2-editor（自作CMSビジュアルエディタ）のビルド+デプロイ
      - name: Install cms2-editor deps
        working-directory: ./cms2-editor
        run: npm ci

      - name: Build cms2-editor
        working-directory: ./cms2-editor
        run: npm run build

      - name: Deploy cms2-editor /editor/ to XSERVER
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cms2-editor/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR_CMS2_EDITOR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**

      - name: Deploy cms2-editor PHP API to XSERVER
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cms2-editor/api/
          server-dir: ${{ secrets.FTP_SERVER_DIR_CMS2_API }}
          dangerous-clean-slate: false
          exclude: |
            **/test_*.php
            **/.git*
