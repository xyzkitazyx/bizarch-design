<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="w1000Title">
  <title id="w1000Title">1000万円の壁</title>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#111827" stroke-width="2"/>
  <!-- 大きな壁＋頂上の旗 -->
  <rect x="50" y="60" width="100" height="110" fill="#FF7A59" opacity="0.2"/>
  <rect x="50" y="60" width="100" height="110" fill="none" stroke="#FF7A59" stroke-width="3"/>
  <line x1="70" y1="60" x2="70" y2="170" stroke="#FF7A59" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="170" stroke="#FF7A59" stroke-width="1.5"/>
  <line x1="130" y1="60" x2="130" y2="170" stroke="#FF7A59" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="150" y2="90" stroke="#FF7A59" stroke-width="1.5"/>
  <line x1="50" y1="120" x2="150" y2="120" stroke="#FF7A59" stroke-width="1.5"/>
  <line x1="50" y1="150" x2="150" y2="150" stroke="#FF7A59" stroke-width="1.5"/>
  <!-- 旗 -->
  <line x1="100" y1="60" x2="100" y2="20" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 22 L130 30 L100 40 Z" fill="#0066FF" stroke="#0066FF" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 数字 -->
  <text x="100" y="115" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="900" fill="#FF7A59" text-anchor="middle">1000</text>
  <text x="100" y="138" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#FF7A59" text-anchor="middle">万円</text>
  <text x="100" y="190" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">インボイス・法人化の壁</text>
</svg>
