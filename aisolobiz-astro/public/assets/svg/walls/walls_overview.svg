<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="wallsOvTitle">
  <title id="wallsOvTitle">6つの壁・全体ダッシュボード</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <pattern id="bpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0066FF" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- 背景：Blueprint風 -->
  <rect x="0" y="0" width="800" height="420" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="800" height="420" fill="url(#bpGrid)"/>

  <!-- タイトル -->
  <text x="40" y="38" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="900" fill="#111827">個人事業主が越える「6つの壁」</text>
  <text x="40" y="60" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="500" fill="#6B7280">年商×働き方マトリクスで見る、収入の階段</text>

  <!-- レーン分け：副業/専業 -->
  <line x1="40" y1="100" x2="760" y2="100" stroke="#0066FF" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="50" y="94" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#0066FF">SIDE 副業レーン</text>
  <text x="50" y="118" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#8A2BE2">SOLO 専業レーン</text>

  <!-- 縦軸：金額目盛り -->
  <line x1="40" y1="350" x2="760" y2="350" stroke="#111827" stroke-width="1.5"/>
  <line x1="40" y1="350" x2="40" y2="80" stroke="#111827" stroke-width="1.5"/>

  <!-- 6つの壁（ハードル） -->
  <!-- 103万 -->
  <g transform="translate(110,350)">
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#0066FF" stroke-width="3"/>
    <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#0066FF" stroke-width="3"/>
    <text x="0" y="-40" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="900" fill="#0066FF" text-anchor="middle">103</text>
    <text x="0" y="-60" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">万円</text>
    <text x="0" y="18" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">所得税の壁</text>
    <text x="0" y="32" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">扶養から外れる</text>
  </g>
  <!-- 106万 -->
  <g transform="translate(220,350)">
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#0066FF" stroke-width="3"/>
    <line x1="-15" y1="-50" x2="15" y2="-50" stroke="#0066FF" stroke-width="3"/>
    <text x="0" y="-60" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="900" fill="#0066FF" text-anchor="middle">106</text>
    <text x="0" y="-80" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">万円</text>
    <text x="0" y="18" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">社会保険の壁</text>
    <text x="0" y="32" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">勤務先で社保加入</text>
  </g>
  <!-- 130万 -->
  <g transform="translate(330,350)">
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#FF7A59" stroke-width="3"/>
    <line x1="-15" y1="-80" x2="15" y2="-80" stroke="#FF7A59" stroke-width="3"/>
    <text x="0" y="-90" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="900" fill="#FF7A59" text-anchor="middle">130</text>
    <text x="0" y="-110" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">万円</text>
    <text x="0" y="18" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">国保の壁</text>
    <text x="0" y="32" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">扶養完全離脱</text>
  </g>
  <!-- 150万 -->
  <g transform="translate(450,350)">
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#8A2BE2" stroke-width="3"/>
    <line x1="-15" y1="-110" x2="15" y2="-110" stroke="#8A2BE2" stroke-width="3"/>
    <text x="0" y="-120" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="900" fill="#8A2BE2" text-anchor="middle">150</text>
    <text x="0" y="-140" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">万円</text>
    <text x="0" y="18" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">配偶者特別の壁</text>
    <text x="0" y="32" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">控除が段階縮小</text>
  </g>
  <!-- 200万 -->
  <g transform="translate(580,350)">
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#8A2BE2" stroke-width="3"/>
    <line x1="-15" y1="-150" x2="15" y2="-150" stroke="#8A2BE2" stroke-width="3"/>
    <text x="0" y="-160" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="900" fill="#8A2BE2" text-anchor="middle">200</text>
    <text x="0" y="-180" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">万円</text>
    <text x="0" y="18" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">専業転換の壁</text>
    <text x="0" y="32" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">独立判断ライン</text>
  </g>
  <!-- 1000万 -->
  <g transform="translate(710,350)">
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#FF7A59" stroke-width="3.5"/>
    <line x1="-18" y1="-200" x2="18" y2="-200" stroke="#FF7A59" stroke-width="3.5"/>
    <text x="0" y="-210" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="900" fill="#FF7A59" text-anchor="middle">1000</text>
    <text x="0" y="-230" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">万円</text>
    <text x="0" y="18" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="700" fill="#111827" text-anchor="middle">インボイス・法人化</text>
    <text x="0" y="32" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">消費税課税事業者</text>
  </g>

  <!-- 推移ライン（点線） -->
  <path d="M 110 320 Q 165 305 220 300 Q 275 280 330 270 Q 390 250 450 240 Q 515 215 580 200 Q 645 180 710 150" fill="none" stroke="#0066FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- 凡例 -->
  <g transform="translate(40, 405)">
    <rect x="0" y="-8" width="10" height="10" fill="#0066FF"/>
    <text x="14" y="2" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#111827">税金・社保</text>
    <rect x="100" y="-8" width="10" height="10" fill="#FF7A59"/>
    <text x="114" y="2" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#111827">大きな転換点</text>
    <rect x="220" y="-8" width="10" height="10" fill="#8A2BE2"/>
    <text x="234" y="2" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#111827">専業判断</text>
  </g>
</svg>
