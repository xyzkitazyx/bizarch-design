<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="w103Title">
  <title id="w103Title">103万円の壁</title>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#111827" stroke-width="2"/>
  <!-- 壁 -->
  <rect x="60" y="80" width="80" height="90" fill="#0066FF" opacity="0.15"/>
  <rect x="60" y="80" width="80" height="90" fill="none" stroke="#0066FF" stroke-width="2.5"/>
  <line x1="60" y1="100" x2="140" y2="100" stroke="#0066FF" stroke-width="1.5"/>
  <line x1="60" y1="120" x2="140" y2="120" stroke="#0066FF" stroke-width="1.5"/>
  <line x1="60" y1="140" x2="140" y2="140" stroke="#0066FF" stroke-width="1.5"/>
  <!-- 数字 -->
  <text x="100" y="60" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="900" fill="#0066FF" text-anchor="middle">103万</text>
  <!-- アイコン：盾 -->
  <path d="M100 110 L86 116 L86 132 Q86 142 100 148 Q114 142 114 132 L114 116 Z" fill="#FF7A59" stroke="#FF7A59" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="100" y="135" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">税</text>
  <!-- ラベル -->
  <text x="100" y="190" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">所得税が発生する壁</text>
</svg>
