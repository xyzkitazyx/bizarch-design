<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="w150Title">
  <title id="w150Title">150万円の壁</title>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#111827" stroke-width="2"/>
  <!-- 段階的に低くなる壁（控除縮小を表現） -->
  <rect x="30" y="90" width="25" height="80" fill="#8A2BE2" opacity="0.45" stroke="#8A2BE2" stroke-width="2"/>
  <rect x="60" y="100" width="25" height="70" fill="#8A2BE2" opacity="0.35" stroke="#8A2BE2" stroke-width="2"/>
  <rect x="90" y="115" width="25" height="55" fill="#8A2BE2" opacity="0.25" stroke="#8A2BE2" stroke-width="2"/>
  <rect x="120" y="130" width="25" height="40" fill="#8A2BE2" opacity="0.18" stroke="#8A2BE2" stroke-width="2"/>
  <rect x="150" y="145" width="25" height="25" fill="#8A2BE2" opacity="0.1" stroke="#8A2BE2" stroke-width="2"/>
  <!-- 矢印（縮小方向） -->
  <path d="M40 80 L160 80" stroke="#FF7A59" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M152 74 L160 80 L152 86" fill="none" stroke="#FF7A59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="60" font-family="'Noto Sans JP', sans-serif" font-size="26" font-weight="900" fill="#8A2BE2" text-anchor="middle">150万</text>
  <text x="100" y="190" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">配偶者特別控除の壁</text>
</svg>
