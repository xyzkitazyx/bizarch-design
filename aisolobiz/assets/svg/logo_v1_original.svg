<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 80" width="250" height="80" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">個人事業の教科書 ロゴ（v1 旧版）</title>
  <defs>
    <linearGradient id="lgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
  </defs>
  <!-- アイコンマーク：羅針盤＋電球 -->
  <g transform="translate(12,12)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="url(#lgGrad)" stroke-width="2.5"/>
    <path d="M28 8 L32 28 L28 48 L24 28 Z" fill="url(#lgGrad)"/>
    <circle cx="28" cy="28" r="3" fill="#FF7A59"/>
    <line x1="8" y1="28" x2="48" y2="28" stroke="#0066FF" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- テキスト -->
  <text x="80" y="36" font-family="'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#111827">個人事業の教科書</text>
  <text x="80" y="60" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.5">AI × SOLO BUSINESS</text>
  <!-- アクセントライン -->
  <line x1="80" y1="42" x2="200" y2="42" stroke="#FF7A59" stroke-width="1.5" stroke-linecap="round"/>
</svg>
