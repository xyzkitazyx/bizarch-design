  <line x1="20" y1="170" x2="180" y2="170" stroke="#111827" stroke-width="2"/>
  <!-- 門 -->
  <rect x="50" y="60" width="100" height="110" fill="none" stroke="#FF7A59" stroke-width="3"/>
  <rect x="50" y="60" width="20" height="110" fill="#FF7A59" opacity="0.2"/>
  <rect x="130" y="60" width="20" height="110" fill="#FF7A59" opacity="0.2"/>
