<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="w106Title">
  <title id="w106Title">106万円の壁</title>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#111827" stroke-width="2"/>
  <!-- 段差の壁 -->
  <rect x="40" y="130" width="40" height="40" fill="#0066FF" opacity="0.15" stroke="#0066FF" stroke-width="2"/>
  <rect x="80" y="100" width="40" height="70" fill="#0066FF" opacity="0.2" stroke="#0066FF" stroke-width="2"/>
  <rect x="120" y="70" width="40" height="100" fill="#0066FF" opacity="0.25" stroke="#0066FF" stroke-width="2.5"/>
  <text x="100" y="50" font-family="'Noto Sans JP', sans-serif" font-size="30" font-weight="900" fill="#0066FF" text-anchor="middle">106万</text>
  <!-- 病院マーク -->
  <g transform="translate(140,120)">
    <circle r="12" fill="#FF7A59"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="100" y="190" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">社会保険加入の壁</text>
</svg>
